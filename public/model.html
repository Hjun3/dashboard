<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>빗물받이 막힘 감지 3D 모델</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe3e6; --panel:#f7f8f8; --ink:#1d2328; --muted:#5d666e; --line:#c9cfd4;
  --accent:#e08a12; --btn:#ffffff; --btn-on:#1d2328; --btn-on-ink:#ffffff;
  --s-normal:#2e9a5b; --s-grate:#d4a514; --s-bottom:#e0711c; --s-flood:#d23a3a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c2125; --panel:#252b30; --ink:#eef1f3; --muted:#a3acb3; --line:#3a434a;
    --btn:#2d343a; --btn-on:#eef1f3; --btn-on-ink:#1c2125; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c2125; --panel:#252b30; --ink:#eef1f3; --muted:#a3acb3; --line:#3a434a;
  --btn:#2d343a; --btn-on:#eef1f3; --btn-on-ink:#1c2125; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:1fr 330px;height:100%}
.stage{position:relative;overflow:hidden;min-height:320px}
#view{position:absolute;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
#labels text{font-family:inherit;font-size:13px;font-weight:500;fill:#1d2328;paint-order:stroke;stroke:#ffffffd9;stroke-width:4px}
#labels line{stroke:#1d2328;stroke-width:1.2}
#labels circle{fill:var(--accent);stroke:#1d2328;stroke-width:1}
.panel{background:var(--panel);border-left:1px solid var(--line);padding:22px 20px;overflow-y:auto}
h1{font-size:19px;line-height:1.3;margin:0 0 4px;font-weight:700}
.lead{margin:0 0 20px;color:var(--muted);font-size:14px}
.back{display:inline-block;margin:0 0 12px;font-size:14px;font-weight:700;color:var(--ink)}
h2{font-size:14px;margin:22px 0 8px;font-weight:700}
.states{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.states button,.views button{font:inherit;font-size:14px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--btn);color:var(--ink);cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.states button[aria-pressed="true"],.views button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink);border-color:var(--btn-on)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.readout{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--btn)}
.verdict{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-bottom:8px}
.readout dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:14px}
.readout dt{color:var(--muted)}
.readout dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.reason{margin:10px 0 0;font-size:13.5px}
.note{margin:8px 0 0;font-size:12px;color:var(--muted)}
.views{display:flex;gap:6px;flex-wrap:wrap}
.views button{flex:1 1 auto;justify-content:center}
.toggle{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px;cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--accent)}
.save-row{display:flex;gap:6px;margin-top:6px}
select{font:inherit;font-size:14px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--btn);color:var(--ink)}
.save{flex:1;font:inherit;font-weight:700;font-size:15px;padding:10px;border-radius:8px;border:0;background:var(--accent);color:#1d2328;cursor:pointer}
.save:disabled{opacity:.6;cursor:wait}
.status{font-size:12.5px;color:var(--muted);min-height:1.4em;margin:6px 0 0}
.hint{position:absolute;left:14px;bottom:12px;font-size:12.5px;color:var(--muted);background:var(--panel);padding:4px 10px;border-radius:6px;border:1px solid var(--line)}
#shot{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;z-index:10}
#shot img{max-width:92vw;max-height:78vh;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/20px 20px}
#shot p{color:#fff;margin:0;font-size:14px;text-align:center}
#shot button{font:inherit;padding:8px 18px;border-radius:8px;border:0;cursor:pointer}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:58vh auto;height:auto;min-height:100%}
  .panel{border-left:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion: reduce){ .hint{display:none} }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <div id="view"></div>
    <svg id="labels" aria-hidden="true"></svg>
    <div class="hint">드래그로 회전 · 휠로 확대</div>
  </div>
  <aside class="panel">
    <a class="back" href="/">← 대시보드로 돌아가기</a>
    <h1>빗물받이 막힘 감지 3D 모델</h1>
    <p class="lead">상태를 고르고 각도를 맞춘 뒤 이미지로 저장하세요.</p>

    <h2>상태</h2>
    <div class="states" id="states"></div>
    <div class="readout" aria-live="polite">
      <div class="verdict"><span class="dot" id="vdot"></span><span id="vtext"></span></div>
      <dl>
        <dt>적재량 (로드셀)</dt><dd id="r-w"></dd>
        <dt>수위 (레이더)</dt><dd id="r-l"></dd>
        <dt>강우 (기상청)</dt><dd id="r-r"></dd>
      </dl>
      <p class="reason" id="r-why"></p>
      <p class="note">기준값은 구조물 높이와 기상청 호우특보 기준을 따르며, 실측 후 지점별로 보정합니다.</p>
    </div>

    <h2>보는 각도</h2>
    <div class="views" id="views">
      <button data-v="iso" aria-pressed="true">비스듬히</button>
      <button data-v="front" aria-pressed="false">정면 단면</button>
      <button data-v="top" aria-pressed="false">위에서</button>
    </div>

    <h2>표시</h2>
    <label class="toggle"><input type="checkbox" id="t-labels" checked> 부품 이름</label>
    <label class="toggle"><input type="checkbox" id="t-rain" checked> 빗줄기</label>
    <label class="toggle"><input type="checkbox" id="t-beam" checked> 레이더 측정 범위</label>
    <label class="toggle"><input type="checkbox" id="t-lift"> 덮개 들어 올리기 (센서 보기)</label>

    <h2>이미지 저장</h2>
    <label class="toggle"><input type="checkbox" id="t-transparent" checked> 배경 투명</label>
    <div class="save-row">
      <select id="size" aria-label="저장 크기">
        <option value="2400">가로 2400px</option>
        <option value="3600" selected>가로 3600px</option>
        <option value="4800">가로 4800px</option>
      </select>
      <button class="save" id="save">PNG 저장</button>
    </div>
    <p class="status" id="status"></p>
  </aside>
</div>
<div id="shot" role="dialog" aria-label="저장된 이미지">
  <img id="shot-img" alt="렌더링된 빗물받이 모델">
  <p>이미지를 길게 누르거나 우클릭해서 저장하세요.</p>
  <button id="shot-close">닫기</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const T = THREE;

/* ---------- 상태 정의 ---------- */
const STATES = {
  normal:{name:"정상", color:"--s-normal", level:-0.74, fill:0.02, items:14, onGrate:0, sludge:false, puddle:0, rain:0.45,
    w:"용량의 10%", l:"배수관 아래 (평상시)", r:"약한 비", why:"거름망 적재량이 적고, 비가 와도 물이 고이지 않고 빠집니다."},
  grate:{name:"격자 위 막힘", color:"--s-grate", level:-0.74, fill:0.27, items:230, onGrate:70, sludge:false, puddle:0.55, rain:1,
    w:"용량의 85% (수거 기준 70% 초과)", l:"배수관 아래 · 변화 없음", r:"호우특보 수준", why:"거름망이 수거 기준을 넘었고, 비가 많이 오는데도 수위가 오르지 않습니다. 물이 위에서 막혀 들어오지 못하는 상태입니다. 통신 신호까지 서서히 약해지면 그레이팅 위 덮임 가능성이 더 높습니다."},
  bottom:{name:"하부 막힘", color:"--s-bottom", level:-0.50, fill:0.05, items:45, onGrate:0, sludge:true, puddle:0, rain:1,
    w:"용량의 20%", l:"배수관 위 · 빠지지 않음", r:"호우특보 수준", why:"거름망은 가볍지만 배수관 높이 위로 물이 고인 채 빠지지 않습니다. 아래쪽 배수관이 막힌 상태입니다."},
  flood:{name:"침수 위험", color:"--s-flood", level:-0.07, fill:0.12, items:90, onGrate:10, sludge:true, puddle:1, rain:1.6,
    w:"급감 (물에 뜨는 힘)", l:"그레이팅 바로 아래 · 빠르게 상승", r:"호우특보 수준 이상", why:"수위가 그레이팅 바로 아래까지 빠르게 오르고 있습니다. 넘치기 직전이라 즉시 출동이 필요합니다."}
};
const ORDER = ["normal","grate","bottom","flood"];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- 렌더러 ---------- */
const host = document.getElementById("view");
const renderer = new T.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputEncoding = T.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.setClearColor(0x000000,0);
host.appendChild(renderer.domElement);

const scene = new T.Scene();
const camera = new T.PerspectiveCamera(30,1,0.05,50);
const controls = new T.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 0.8; controls.maxDistance = 6;

scene.add(new T.HemisphereLight(0xf4f7fb,0x6b6258,0.75));
const sun = new T.DirectionalLight(0xffffff,0.95);
sun.position.set(1.6,2.6,2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera; sc.left=-1.6; sc.right=1.6; sc.top=1.6; sc.bottom=-1.6; sc.near=0.5; sc.far=8;
sun.shadow.bias = -0.0008;
scene.add(sun);
const fill = new T.DirectionalLight(0xdfe8ff,0.35); fill.position.set(-2,0.5,1.5); scene.add(fill);

/* ---------- 재질 ---------- */
function noiseTex(base, amp, size){
  const c=document.createElement("canvas"); c.width=c.height=size||256;
  const g=c.getContext("2d"); g.fillStyle=base; g.fillRect(0,0,c.width,c.height);
  const img=g.getImageData(0,0,c.width,c.height), d=img.data;
  for(let i=0;i<d.length;i+=4){const n=(Math.random()-0.5)*amp; d[i]+=n; d[i+1]+=n; d[i+2]+=n;}
  g.putImageData(img,0,0);
  const t=new T.CanvasTexture(c); t.wrapS=t.wrapT=T.RepeatWrapping; t.encoding=T.sRGBEncoding; return t;
}
function speckleTex(base, dots, size){
  const t=noiseTex(base,18,size||512); const g=t.image.getContext("2d");
  for(let i=0;i<dots.n;i++){g.fillStyle=dots.colors[i%dots.colors.length]; const r=Math.random()*dots.r+0.6;
    g.beginPath(); g.arc(Math.random()*t.image.width,Math.random()*t.image.height,r,0,7); g.fill();}
  t.needsUpdate=true; return t;
}
const concreteTex = speckleTex("#b8b4ab",{n:1400,r:1.6,colors:["#9d998f","#c9c5bc","#8f8a80"]});
concreteTex.repeat.set(3,3);
const asphaltTex = speckleTex("#45474a",{n:3000,r:1.4,colors:["#5d5f62","#2f3133","#6d6a64"]});
asphaltTex.repeat.set(4,2);
const soilTex = speckleTex("#8c7660",{n:2200,r:2.2,colors:["#76624e","#a08a72","#5f4f3f"]});
soilTex.repeat.set(3,3);
const paveTex = (function(){
  const c=document.createElement("canvas"); c.width=c.height=256; const g=c.getContext("2d");
  g.fillStyle="#c9c2b6"; g.fillRect(0,0,256,256);
  g.strokeStyle="#a69e91"; g.lineWidth=4;
  for(let i=0;i<=256;i+=64){g.beginPath();g.moveTo(i,0);g.lineTo(i,256);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(256,i);g.stroke();}
  const t=new T.CanvasTexture(c); t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(5,2); t.encoding=T.sRGBEncoding; return t;
})();

const M = {
  concrete:new T.MeshStandardMaterial({map:concreteTex,roughness:0.95}),
  asphalt:new T.MeshStandardMaterial({map:asphaltTex,roughness:0.9}),
  soil:new T.MeshStandardMaterial({map:soilTex,roughness:1}),
  pave:new T.MeshStandardMaterial({map:paveTex,roughness:0.85}),
  curb:new T.MeshStandardMaterial({map:concreteTex,color:0xd8d4cc,roughness:0.9}),
  gutter:new T.MeshStandardMaterial({map:concreteTex,color:0xc4c0b8,roughness:0.9}),
  steel:new T.MeshStandardMaterial({color:0x4f555b,metalness:0.65,roughness:0.42}),
  basket:new T.MeshStandardMaterial({color:0x1f6d78,roughness:0.55}),
  sensor:new T.MeshStandardMaterial({color:0xe08a12,roughness:0.4,metalness:0.2}),
  alu:new T.MeshStandardMaterial({color:0xc4c9ce,metalness:0.7,roughness:0.3}),
  black:new T.MeshStandardMaterial({color:0x22262a,roughness:0.6}),
  box:new T.MeshStandardMaterial({color:0xeceae4,roughness:0.6}),
  pipe:new T.MeshStandardMaterial({color:0x8d9396,roughness:0.7,side:T.DoubleSide}),
  pipeIn:new T.MeshStandardMaterial({color:0x1a1c1e,roughness:1,side:T.BackSide}),
  cable:new T.MeshStandardMaterial({color:0x2b2f33,roughness:0.7}),
  water:new T.MeshStandardMaterial({color:0x3f8fd2,transparent:true,opacity:0.5,roughness:0.15,metalness:0.1,depthWrite:false}),
  waterTop:new T.MeshStandardMaterial({color:0x6aaee6,transparent:true,opacity:0.55,roughness:0.08,metalness:0.2,depthWrite:false,side:T.DoubleSide}),
  sludge:new T.MeshStandardMaterial({color:0x3a2e22,roughness:1}),
  beam:new T.MeshBasicMaterial({color:0x7fe3c4,transparent:true,opacity:0.28,depthWrite:false,side:T.DoubleSide})
};

/* 거름망 메쉬 텍스처: 셀 1개를 반복 */
const CELL = 0.024;
const meshCanvas = (function(){
  const c=document.createElement("canvas"); c.width=c.height=64; const g=c.getContext("2d");
  g.clearRect(0,0,64,64); g.fillStyle="#ffffff"; g.fillRect(0,0,64,7); g.fillRect(0,0,7,64);
  return c;
})();
function meshMat(ru,rv){
  const t=new T.CanvasTexture(meshCanvas); t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(ru,rv);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return new T.MeshStandardMaterial({color:0x1f6d78,alphaMap:t,transparent:false,alphaTest:0.5,side:T.DoubleSide,roughness:0.55});
}

/* ---------- 지오메트리 도우미 ---------- */
const world = new T.Group(); scene.add(world);
function box(x0,x1,y0,y1,z0,z1,mat,opt){
  const m=new T.Mesh(new T.BoxGeometry(x1-x0,y1-y0,z1-z0),mat);
  m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  m.castShadow=!(opt&&opt.noCast); m.receiveShadow=true; (opt&&opt.parent||world).add(m); return m;
}

/* 치수 (m): 내부 x ±0.25, z ±0.225, 깊이 0.80 */
const IX=0.25, IZ=0.225, IH=0.80, WT=0.08;
const OX=IX+WT, OZ=IZ+WT, FRONT=OZ;
const ROADX=1.05, BACK=-1.15, CURB1=-OZ, CURB0=-OZ-0.15, SLAB=-0.12;

// 흙(단면)
box(-ROADX,-OX,-1.0,SLAB,BACK,FRONT,M.soil);
box(OX,ROADX,-1.0,SLAB,BACK,FRONT,M.soil);
box(-OX,OX,-1.0,SLAB,BACK,-OZ,M.soil);
box(-OX,OX,-1.0,-IH-WT,-OZ,FRONT,M.soil);
// 빗물받이 콘크리트 몸체
box(-OX,-IX,-IH-WT,0,-OZ,FRONT,M.concrete);
box(IX,OX,-IH-WT,0,-OZ,FRONT,M.concrete);
box(-IX,IX,-IH-WT,0,-OZ,-IZ,M.concrete);
box(-IX,IX,-IH-WT,-IH,-IZ,FRONT,M.concrete);
// 도로(아스팔트)
// 측구(콘크리트 물길): 빗물받이는 측구 안, 연석에 붙어 있음
box(-ROADX,-OX,SLAB,0,CURB1,FRONT,M.gutter);
box(OX,ROADX,SLAB,0,CURB1,FRONT,M.gutter);
// 연석, 보도
box(-ROADX,ROADX,SLAB,0.15,CURB0,CURB1,M.curb);
box(-ROADX,ROADX,SLAB,0.13,BACK,CURB0,M.pave);

/* 배수관: 뒷벽 하단 가운데, 거름망 아치 바로 아래로 빠짐 */
const PIPE_Y=-0.66, PIPE_R=0.065;
(function(){
  const len=IZ-BACK-0.05;
  const g=new T.CylinderGeometry(PIPE_R,PIPE_R,len,32,1,true); g.rotateX(Math.PI/2);
  const p=new T.Mesh(g,M.pipe); p.position.set(0,PIPE_Y,-IZ-len/2+0.005); world.add(p);
  const pin=new T.Mesh(g.clone(),M.pipeIn); pin.scale.set(0.99,0.99,1); pin.position.copy(p.position); world.add(pin);
  const ring=new T.Mesh(new T.TorusGeometry(PIPE_R+0.004,0.007,10,40),M.pipe); ring.position.set(0,PIPE_Y,-IZ+0.003); world.add(ring);
  const hole=new T.Mesh(new T.CircleGeometry(PIPE_R,32),new T.MeshBasicMaterial({color:0x101113})); hole.position.set(0,PIPE_Y,-IZ+0.002); world.add(hole);
})();

/* 그레이팅(격자 덮개) */
const grate = new T.Group(); world.add(grate);
(function(){
  const t=0.035, fw=0.018;
  box(-IX,IX,-t,0,-IZ,-IZ+fw,M.steel,{parent:grate});
  box(-IX,IX,-t,0,IZ-fw,IZ,M.steel,{parent:grate});
  box(-IX,-IX+fw,-t,0,-IZ,IZ,M.steel,{parent:grate});
  box(IX-fw,IX,-t,0,-IZ,IZ,M.steel,{parent:grate});
  const n=15;
  for(let i=1;i<n;i++){const x=-IX+fw+(2*(IX-fw))*i/n; box(x-0.003,x+0.003,-t,0,-IZ,IZ,M.steel,{parent:grate});}
  for(let j=1;j<5;j++){const z=-IZ+(2*IZ)*j/5; box(-IX,IX,-0.012,-0.002,z-0.003,z+0.003,M.steel,{parent:grate});}
})();

/* ---------- 거름망(바스켓) ---------- */
const BX=0.17, BZ=0.16, BOZ=0.017, BTOP=-0.085, OV=0.04, BBOT=-0.40, HUMP=-0.335;
const ARCH_R=((2*BX)*(2*BX)/4+(BBOT-HUMP)*(BBOT-HUMP))/(2*(HUMP-BBOT));
const ARCH_C=HUMP-ARCH_R;
const archY = x => ARCH_C+Math.sqrt(Math.max(0,ARCH_R*ARCH_R-x*x));
const basket = new T.Group(); world.add(basket); basket.position.z=BOZ;
(function(){
  // 앞·뒤 면 (아치 하단)
  const a1=Math.atan2(BBOT-ARCH_C,BX), a2=Math.atan2(BBOT-ARCH_C,-BX);
  const sh=new T.Shape(); sh.moveTo(-BX,BTOP-OV); sh.lineTo(BX,BTOP-OV); sh.lineTo(BX,BBOT);
  sh.absarc(0,ARCH_C,ARCH_R,a1,a2,false); sh.lineTo(-BX,BTOP-OV);
  const sg=new T.ShapeGeometry(sh,24);
  [BZ,-BZ].forEach(z=>{const m=new T.Mesh(sg,meshMat(1/CELL,1/CELL)); m.position.z=z; basket.add(m);});
  // 좌·우 면
  [BX,-BX].forEach(x=>{
    const m=new T.Mesh(new T.PlaneGeometry(2*BZ,BTOP-OV-BBOT),meshMat(2*BZ/CELL,(BTOP-OV-BBOT)/CELL));
    m.rotation.y=Math.PI/2; m.position.set(x,(BTOP-OV+BBOT)/2,0); basket.add(m);
  });
  // 아치 바닥
  const half=Math.asin(BX/ARCH_R);
  const cg=new T.CylinderGeometry(ARCH_R,ARCH_R,2*BZ,40,1,true,Math.PI-half,2*half);
  cg.rotateX(Math.PI/2);
  const arcLen=2*half*ARCH_R;
  const bottom=new T.Mesh(cg,meshMat(arcLen/CELL,2*BZ/CELL)); bottom.position.y=ARCH_C; basket.add(bottom);
  // 프레임
  const fr=0.009;
  const fb=(x0,x1,y0,y1,z0,z1)=>box(x0,x1,y0,y1,z0,z1,M.basket,{parent:basket});
  fb(-BX-fr,BX+fr,BTOP-fr,BTOP+fr,BZ-fr,BZ+fr); fb(-BX-fr,BX+fr,BTOP-fr,BTOP+fr,-BZ-fr,-BZ+fr);
  fb(-BX-fr,-BX+fr,BTOP-fr,BTOP+fr,-BZ,BZ); fb(BX-fr,BX+fr,BTOP-fr,BTOP+fr,-BZ,BZ);
  [[-BX,-BZ],[BX,-BZ],[-BX,BZ],[BX,BZ]].forEach(([x,z])=>fb(x-fr,x+fr,BBOT,BTOP,z-fr,z+fr));
  fb(-BX-fr,-BX+fr,BBOT-fr,BBOT+fr,-BZ,BZ); fb(BX-fr,BX+fr,BBOT-fr,BBOT+fr,-BZ,BZ);
  [BZ,-BZ].forEach(z=>{
    const pts=[]; for(let i=0;i<=24;i++){const x=-BX+2*BX*i/24; pts.push(new T.Vector3(x,archY(x),z));}
    const tb=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),40,fr,8,false),M.basket); tb.castShadow=true; basket.add(tb);
  });
  // 로드셀 위에 걸리는 날개
  [-1,1].forEach(s=>fb(s>0?BX:-BX-0.043, s>0?BX+0.043:-BX, BTOP-0.013,BTOP+0.004,-0.06,0.06));
  // 넘침 통로: 상단 띠는 메쉬 없이 뚫려 있고 세로 리브만 있음
  const TM=BTOP-OV;
  fb(-BX-fr,BX+fr,TM-fr,TM+fr,BZ-fr,BZ+fr); fb(-BX-fr,BX+fr,TM-fr,TM+fr,-BZ-fr,-BZ+fr);
  fb(-BX-fr,-BX+fr,TM-fr,TM+fr,-BZ,BZ); fb(BX-fr,BX+fr,TM-fr,TM+fr,-BZ,BZ);
  for(let i=1;i<8;i++){const x=-BX+2*BX*i/8; [BZ,-BZ].forEach(z=>fb(x-0.004,x+0.004,TM,BTOP,z-0.004,z+0.004));}
  for(let i=1;i<6;i++){const z=-BZ+2*BZ*i/6; [BX,-BX].forEach(x=>fb(x-0.004,x+0.004,TM,BTOP,z-0.004,z+0.004));}
  // 손잡이: 앞·뒤 테두리에 붙은 평판 + 손가락 구멍 (입구를 가로지르지 않음)
  [1,-1].forEach(s=>{
    const w=0.075, d=0.03, hw=0.045, hd=0.009;
    const sh=new T.Shape(); sh.moveTo(-w,0); sh.lineTo(w,0); sh.lineTo(w,-d); sh.lineTo(-w,-d); sh.lineTo(-w,0);
    const hole=new T.Path(); hole.absellipse(0,-d/2,hw,hd,0,Math.PI*2,true); sh.holes.push(hole);
    const g=new T.ExtrudeGeometry(sh,{depth:0.008,bevelEnabled:false}); g.rotateX(Math.PI/2);
    const m=new T.Mesh(g,M.basket); m.castShadow=true;
    m.scale.z=s; m.position.set(0,BTOP+0.004,s*BZ); basket.add(m);
  });
})();

/* ---------- 쓰레기 ---------- */
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return (seed-1)/2147483646;};
const LEAF_C=[0x8a5a2b,0xa8702f,0xb98b2e,0x6f7a2e,0x9c4f24,0x7a5130];
const leafGeo=new T.CircleGeometry(1,10); leafGeo.scale(1,0.45,1);
const buttGeo=new T.CylinderGeometry(0.0042,0.0042,0.026,10);
const wrapGeo=new T.PlaneGeometry(0.045,0.03,2,2);
const leafMats=LEAF_C.map(c=>new T.MeshStandardMaterial({color:c,roughness:0.8,side:T.DoubleSide}));
const buttMat=new T.MeshStandardMaterial({color:0xd99a4e,roughness:0.7});
const buttMat2=new T.MeshStandardMaterial({color:0xf2efe8,roughness:0.7});
const wrapMats=[0xd23a3a,0x2f6fd6,0xe8e8e8,0x3ca05a].map(c=>new T.MeshStandardMaterial({color:c,roughness:0.4,side:T.DoubleSide}));
const trash = new T.Group(); world.add(trash);
function addPiece(x,y,z,big){
  const r=rnd(); let m;
  if(r<0.72){const s=(big?0.03:0.02)+rnd()*0.018; m=new T.Mesh(leafGeo,leafMats[(rnd()*leafMats.length)|0]); m.scale.set(s,s,s);}
  else if(r<0.92){m=new T.Group(); const a=new T.Mesh(buttGeo,buttMat), b=new T.Mesh(buttGeo,buttMat2); a.scale.y=0.4; a.position.y=-0.008; b.scale.y=0.6; b.position.y=0.005; m.add(a,b);}
  else {m=new T.Mesh(wrapGeo,wrapMats[(rnd()*wrapMats.length)|0]); const p=m.geometry.attributes.position;}
  m.position.set(x,y,z); m.rotation.set(rnd()*Math.PI,rnd()*Math.PI,rnd()*Math.PI);
  m.traverse(o=>{if(o.isMesh){o.castShadow=true;}});
  trash.add(m);
}
function buildTrash(st){
  trash.clear(); seed=11;
  for(let i=0;i<st.items;i++){
    const x=(rnd()*2-1)*(BX-0.02), z=(rnd()*2-1)*(BZ-0.02)+BOZ;
    const h=Math.pow(rnd(),0.8)*st.fill;
    const yb=archY(x)+0.008;
    addPiece(x,Math.min(yb+h,BTOP-OV-0.008),z);
  }
  for(let i=0;i<st.onGrate;i++){
    const x=(rnd()*2-1)*(IX+0.06), z=-IZ-0.02+rnd()*(2*IZ+0.04);
    addPiece(x,grate.position.y+0.006+rnd()*0.018,z,true);
  }
  if(st.sludge){
    const sg=new T.SphereGeometry(1,12,10);
    for(let i=0;i<46;i++){
      const a=rnd()*Math.PI*2, rr=rnd()*PIPE_R*0.95;
      const s=0.012+rnd()*0.02;
      const m=new T.Mesh(sg,M.sludge); m.scale.set(s*1.4,s,s*1.2);
      m.position.set(Math.cos(a)*rr, PIPE_Y+Math.sin(a)*rr, -IZ+0.01+rnd()*0.06); trash.add(m);
    }
    for(let i=0;i<70;i++){
      const s=0.012+rnd()*0.022; const m=new T.Mesh(sg,M.sludge); m.scale.set(s*1.6,s*0.6,s*1.4);
      m.position.set((rnd()*2-1)*(IX-0.02),-IH+s*0.4,(rnd()*2-1)*(IZ-0.01)+0.03); trash.add(m);
    }
    // 배수관 안쪽 막힘 덩어리
    const plug=new T.Mesh(new T.CylinderGeometry(PIPE_R*0.96,PIPE_R*0.96,0.08,24),M.sludge); plug.rotation.x=Math.PI/2; plug.position.set(0,PIPE_Y,-IZ+0.004); trash.add(plug);
  }
}

const RAIN_N=900;
const rainGeo=new T.BufferGeometry();
const rainPos=new Float32Array(RAIN_N*6);
const rainSeed=[];
for(let i=0;i<RAIN_N;i++){rainSeed.push([(Math.random()*2-1)*ROADX, Math.random()*1.3, BACK+0.2+Math.random()*(FRONT-BACK-0.2), 0.6+Math.random()*0.5]);}
rainGeo.setAttribute("position",new T.BufferAttribute(rainPos,3));
const rainMat=new T.LineBasicMaterial({color:0x8fb3d6,transparent:true,opacity:0.55});
const rain=new T.LineSegments(rainGeo,rainMat); rain.frustumCulled=false; world.add(rain);
let rainAmt=1, rainT=0;
function updateRain(dt){
  rainT+=dt;
  const visible=Math.floor(RAIN_N*Math.min(1,rainAmt/1.6));
  for(let i=0;i<RAIN_N;i++){
    const s=rainSeed[i]; const o=i*6;
    if(i>=visible){rainPos.fill(0,o,o+6); rainPos[o+1]=-50; rainPos[o+4]=-50; continue;}
    let y=1.3-((s[1]+rainT*s[3]*1.6)%1.3);
    rainPos[o]=s[0]; rainPos[o+1]=y+0.06; rainPos[o+2]=s[2];
    rainPos[o+3]=s[0]-0.004; rainPos[o+4]=y; rainPos[o+5]=s[2];
  }
  rainGeo.attributes.position.needsUpdate=true;
}

  {t:"넘침 통로 (거름망이 차도 물이 빠짐)", p:()=>new T.Vector3(-BX*0.45,BTOP-OV/2,BZ+BOZ), side:"L"},
  {t:"탈부착 거름망", p:()=>new T.Vector3(-BX,-0.24,BZ+BOZ), side:"L"},
  {t:"싱글 포인트 로드셀 (왼쪽)", p:()=>new T.Vector3(-0.205,LC_Y,0.06), side:"L"},
  {t:"거치 프레임 (턱 위에 얹음)", p:()=>new T.Vector3(-IX+0.02,FY1,0.12), side:"L"},
  {t:"싱글 포인트 로드셀 (오른쪽)", p:()=>new T.Vector3(0.205,LC_Y,0.06), side:"R"},
  {t:"통신 모듈·배터리 (프레임 내장)", p:()=>new T.Vector3(ND.x-0.055,ND.y,ND.z+0.019), side:"L"},
  {t:"신호 증폭기 (밀봉형)", p:()=>new T.Vector3(0.22,LC_Y-0.024,-0.02), side:"R"},
  {t:"세로 가이드 (기울지 않게)", p:()=>new T.Vector3(-(BX+0.026),-0.2,BOZ+BZ+0.015), side:"L"},
  {t:"레이더 수위 센서", p:()=>new T.Vector3(RD.x,RD.y-0.02,RD.z+0.02), side:"R"},
  {t:"배수관", p:()=>new T.Vector3(0.05,PIPE_Y-0.03,-IZ), side:"R"},
  {t:"연석", p:()=>new T.Vector3(-0.7,0.15,(CURB0+CURB1)/2), side:"L"}
];
function layoutLabels(w,h,scale){
  const v=new T.Vector3(), out=[];
  LABELS.forEach(L=>{
    v.copy(L.p()); v.project(camera);
    if(v.z>1) return;
    out.push({t:L.t, side:L.side, ax:(v.x*0.5+0.5)*w, ay:(-v.y*0.5+0.5)*h});
  });
  const gap=26*scale;
  ["L","R"].forEach(s=>{
    const col=out.filter(o=>o.side===s).sort((a,b)=>a.ay-b.ay);
    let last=-1e9;
    col.forEach(o=>{o.ly=Math.max(o.ay,last+gap); last=o.ly;});
    const overflow=last-(h-20*scale); if(overflow>0) col.forEach(o=>o.ly-=overflow);
    col.forEach(o=>{o.lx = s==="L" ? Math.min(o.ax-40*scale, w*0.24) : Math.max(o.ax+40*scale, w*0.76);});
  });
  return out;
}
const svg=document.getElementById("labels");
function drawSvgLabels(){
  const w=host.clientWidth,h=host.clientHeight;
  if(!document.getElementById("t-labels").checked){svg.innerHTML=""; return;}
  const L=layoutLabels(w,h,1); let s="";
  L.forEach(o=>{
    const tx=o.side==="L"?o.lx-6:o.lx+6, anchor=o.side==="L"?"end":"start";
    s+='<line x1="'+o.ax+'" y1="'+o.ay+'" x2="'+o.lx+'" y2="'+o.ly+'"/>';
    s+='<circle cx="'+o.ax+'" cy="'+o.ay+'" r="3.5"/>';
    s+='<text x="'+tx+'" y="'+(o.ly+4.5)+'" text-anchor="'+anchor+'"></text>';
  });
  svg.innerHTML=s;
  svg.querySelectorAll("text").forEach((el,i)=>el.textContent=L[i].t);
}

/* ---------- 크기 ---------- */
function resize(){
  const w=host.clientWidth,h=host.clientHeight; if(!w||!h) return;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
window.addEventListener("resize",resize);

/* ---------- 토글 ---------- */
document.getElementById("t-rain").addEventListener("change",e=>rain.visible=e.target.checked);
document.getElementById("t-beam").addEventListener("change",e=>beam.visible=e.target.checked);
document.getElementById("t-lift").addEventListener("change",e=>{grate.position.y=e.target.checked?0.22:0; applyState(current);});

/* ---------- 저장 ---------- */
const statusEl=document.getElementById("status");
let downloads=null;
if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("downloads").then(d=>{downloads=d;}).catch(()=>{});
}
async function capture(){
  const W=parseInt(document.getElementById("size").value,10);
  const w=host.clientWidth,h=host.clientHeight; const H=Math.round(W*h/w);
  const transparent=document.getElementById("t-transparent").checked;
  const prevPR=renderer.getPixelRatio();
  renderer.setPixelRatio(1); renderer.setSize(W,H,false);
  camera.aspect=W/H; camera.updateProjectionMatrix();
  renderer.render(scene,camera);
  const out=document.createElement("canvas"); out.width=W; out.height=H;
  const g=out.getContext("2d");
  if(!transparent){g.fillStyle="#ffffff"; g.fillRect(0,0,W,H);}
  g.drawImage(renderer.domElement,0,0);
  if(document.getElementById("t-labels").checked){
    const k=W/w; const L=layoutLabels(W,H,k);
    g.font="500 "+Math.round(13*k)+"px 'IBM Plex Sans KR', sans-serif";
    L.forEach(o=>{
      g.strokeStyle="#1d2328"; g.lineWidth=1.2*k; g.beginPath(); g.moveTo(o.ax,o.ay); g.lineTo(o.lx,o.ly); g.stroke();
      g.fillStyle="#e08a12"; g.beginPath(); g.arc(o.ax,o.ay,3.5*k,0,7); g.fill(); g.stroke();
      g.textAlign=o.side==="L"?"right":"left"; g.textBaseline="middle";
      const tx=o.side==="L"?o.lx-6*k:o.lx+6*k;
      g.lineWidth=4*k; g.strokeStyle="rgba(255,255,255,.85)"; g.lineJoin="round"; g.strokeText(o.t,tx,o.ly);
      g.fillStyle="#1d2328"; g.fillText(o.t,tx,o.ly);
    });
  }
  renderer.setPixelRatio(prevPR); resize();
  return new Promise(r=>out.toBlob(r,"image/png"));
}
document.getElementById("save").addEventListener("click",async()=>{
  const btn=document.getElementById("save"); btn.disabled=true; statusEl.textContent="이미지를 만드는 중입니다…";
  try{
    const blob=await capture();
    const name="빗물받이_"+STATES[current].name.replace(/\s/g,"")+".png";
    if(downloads){
      try{ await downloads.save({filename:name,data:blob}); statusEl.textContent="저장했습니다: "+name; }
      catch(e){ statusEl.textContent = e&&e.code==="declined" ? "저장을 취소했습니다." : "바로 저장할 수 없어 이미지를 띄웠습니다."; if(!(e&&e.code==="declined")) showShot(blob); }
    } else { showShot(blob); statusEl.textContent="이미지를 띄웠습니다. 길게 누르거나 우클릭해서 저장하세요."; }
  }catch(e){ statusEl.textContent="이미지를 만들지 못했습니다. 저장 크기를 줄여서 다시 시도하세요."; }
  btn.disabled=false;
});
function showShot(blob){
  const img=document.getElementById("shot-img"); img.src=URL.createObjectURL(blob);
  document.getElementById("shot").style.display="flex";
}
document.getElementById("shot-close").addEventListener("click",()=>{document.getElementById("shot").style.display="none";});

/* ---------- 루프 ---------- */
const clock=new T.Clock();
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function loop(){
  const dt=Math.min(clock.getDelta(),0.05);
  if(rain.visible) updateRain(reduce?0:dt);
  controls.update();
  renderer.render(scene,camera);
  drawSvgLabels();
  requestAnimationFrame(loop);
}
// 주소의 ?state=normal|grate|bottom|flood 로 처음 상태를 고른다
const qs=new URLSearchParams(location.search).get("state");
resize(); setView("iso"); applyState(STATES[qs]?qs:"normal"); updateRain(0.01); loop();
window.__setState=applyState; window.__setView=setView; window.__lift=v=>{document.getElementById('t-lift').checked=v; grate.position.y=v?0.22:0; applyState(current);};
})();
</script>
